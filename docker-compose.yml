services:

#start db container 
  db:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: nautilus
      POSTGRES_USER: nautilus_owner        #
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"              
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nautilus_owner -d nautilus"]
      interval: 5s
      timeout: 3s
      retries: 10

#start for backend container
  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy         # start when healthy
    environment:
      GROQ_API_KEY: ${GROQ_API_KEY:?set GROQ_API_KEY in .env}
      APP_DB_PASSWORD: ${APP_DB_PASSWORD:?set APP_DB_PASSWORD in .env}
      OWNER_DATABASE_URL: postgresql://nautilus_owner:${POSTGRES_PASSWORD}@db:5432/nautilus
      DATABASE_URL: postgresql://nautilus_app:${APP_DB_PASSWORD}@db:5432/nautilus
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8080,http://localhost:5173}
      HF_HUB_OFFLINE: "0"                  
    ports:
      - "8000:8000"
  
#web GUI for DB
  adminer:
    image: adminer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      - db

#start forntend 
  frontend:
    image: node:20
    working_dir: /app
    command: sh -c "npm install && npm run dev -- --host"
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "8080:8080"

volumes:
  pgdata:
  frontend_node_modules: